# typos configuration - https://github.com/crate-ci/typos
# Add false positives here. The pre-commit hook passes --force-exclude, which is
# what makes the exclusions below apply to files it names explicitly.

[files]
extend-exclude = [
    # Written by semantic-release on every release, and not to be edited by
    # hand: the abbreviated commit hashes in its links trip the checker, and a
    # correction would be lost with the next release.
    "CHANGELOG.md",
    "*.lock",
    "*.min.js",
    "*.min.css",
    "node_modules/",
    ".venv/",
    "apps/api/alembic/versions/",
    "apps/ui/src/api/generated/",
]

[default]
extend-ignore-identifiers-re = [
    # Network/infra terms that look like typos
    "oid",       # SNMP OID
    "asn",       # Autonomous System Number
    "tty",       # Terminal
    "pty",       # Pseudo-terminal
]

[default.extend-words]
# Technical terms that are valid
ba = "ba"        # Base address
nd = "nd"        # Node
Hashi = "Hashi"  # HashiCorp vendor name stem
