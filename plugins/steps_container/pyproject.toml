[project]
name = "hegemony-steps-container"
version = "0.26.0"
description = "Docker container execution step handler for Hegemony"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE-*.txt"]
requires-python = ">=3.11"
dependencies = [
    "hegemony-step-sdk==0.26.0",
    "httpx>=0.27.0",
]

[project.entry-points."hegemony.step_handlers"]
"container" = "hegemony_steps_container:register"

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hegemony_steps_container"
module-root = "src"
