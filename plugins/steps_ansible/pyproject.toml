[project]
name = "hegemony-steps-ansible"
version = "0.18.0"
description = "Ansible playbook step handler for Hegemony (inventory generated from Hegemony's inventory)"
readme = "README.md"
license = "AGPL-3.0-or-later AND MIT"
license-files = ["LICENSE-*.txt"]
requires-python = ">=3.11"
dependencies = [
    "hegemony-step-sdk==0.18.0",
    # Built on container.run's runner: a deployment without container
    # execution cannot install this wheel either.
    "hegemony-steps-container==0.18.0",
]

[project.entry-points."hegemony.step_handlers"]
ansible = "hegemony_steps_ansible:register"

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hegemony_steps_ansible"
module-root = "src"
