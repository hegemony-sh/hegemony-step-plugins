[project]
name = "hegemony-steps-netbox"
version = "0.59.0"
description = "NetBox step handlers for Hegemony (REST calls, IP address management, config rendering)"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE-*.txt"]
requires-python = ">=3.11"
# Every NetBox call goes through http.request's client, so a deployment that
# leaves out outbound HTTP from workers (no hegemony-steps-http) has no
# NetBox steps either.
dependencies = [
    "hegemony-step-sdk>=1.1,<2",
    "hegemony-steps-http==0.59.0",
    "httpx>=0.27.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://hegemony.sh"
Documentation = "https://hegemony.sh"
Source = "https://github.com/hegemony-sh/hegemony-step-plugins"
Issues = "https://github.com/hegemony-sh/hegemony-step-plugins/issues"
Changelog = "https://github.com/hegemony-sh/hegemony-step-plugins/blob/main/CHANGELOG.md"

[project.entry-points."hegemony.step_handlers"]
"netbox" = "hegemony_steps_netbox:register"

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hegemony_steps_netbox"
module-root = "src"
