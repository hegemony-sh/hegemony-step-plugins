[project]
name = "hegemony-steps-monitor"
version = "0.42.1"
description = "Background connectivity-monitor step handlers for Hegemony"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE-*.txt"]
requires-python = ">=3.11"
dependencies = [
    "hegemony-step-sdk==0.42.1",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://hegemony.sh"
Documentation = "https://hegemony.sh"
Source = "https://github.com/hegemony-sh/hegemony-step-plugins"
Issues = "https://github.com/hegemony-sh/hegemony-step-plugins/issues"
Changelog = "https://github.com/hegemony-sh/hegemony-step-plugins/blob/main/CHANGELOG.md"

[project.entry-points."hegemony.step_handlers"]
"monitor" = "hegemony_steps_monitor:register"

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hegemony_steps_monitor"
module-root = "src"
