[project]
name = "hegemony-steps-inventory"
version = "0.32.4"
description = "Inventory step handlers for Hegemony (sync an inventory provider from a flow)"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE-*.txt"]
requires-python = ">=3.11"
dependencies = [
    "hegemony-step-sdk==0.32.4",
]

[project.entry-points."hegemony.step_handlers"]
"inventory" = "hegemony_steps_inventory:register"

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hegemony_steps_inventory"
module-root = "src"
