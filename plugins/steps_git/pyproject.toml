[project]
name = "hegemony-steps-git"
version = "0.48.0"
description = "Git step handlers (commit evidence to a repository) for Hegemony"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE-*.txt"]
requires-python = ">=3.11"
dependencies = [
    "hegemony-step-sdk==0.48.0",
    # Built on container.run's runner: a deployment without container
    # execution cannot install this wheel either.
    "hegemony-steps-container==0.48.0",
]

[project.entry-points."hegemony.step_handlers"]
git = "hegemony_steps_git:register"

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hegemony_steps_git"
module-root = "src"
