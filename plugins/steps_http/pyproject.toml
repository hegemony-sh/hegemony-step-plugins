[project]
name = "hegemony-steps-http"
version = "0.13.0"
description = "HTTP(S) request step handler for Hegemony (http.request)"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE-*.txt"]
requires-python = ">=3.11"
dependencies = [
    "hegemony-step-sdk==0.13.0",
    "httpx>=0.27.0",
]

[project.entry-points."hegemony.step_handlers"]
"http" = "hegemony_steps_http:register"

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hegemony_steps_http"
module-root = "src"
