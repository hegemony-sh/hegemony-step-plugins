name: Release Wheels

on:
  push:
    tags:
      - "v*"
  # Cut a release without a terminal: dispatching on a branch creates the
  # given tag at that branch's head inside this same run, then releases it —
  # identical to pushing the tag by hand.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create at this branch's head (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  release:
    name: Build And Publish Wheel Assets
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the GitHub Release and upload assets
      id-token: write # to mint OIDC tokens for attestation signing
      attestations: write # to attach build provenance attestations
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Resolve release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::release tag must look like vX.Y.Z, got '$TAG'"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # The tag is created by this run itself on dispatch, so the release
      # steps below behave exactly as on a tag push. A tag created with the
      # workflow's own token does not trigger a second run.
      - name: Create release tag (dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" -f sha="${GITHUB_SHA}"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098 # v7
        with:
          version: "0.9.28"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --frozen --all-packages

      - name: Verify tag matches package versions
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: uv run python scripts/verify_release_version.py "${TAG}"

      - name: Verify release does not already exist
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::error::Release ${TAG} already exists; releases are immutable."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}

      - name: Run tests
        run: uv run pytest -v --tb=short

      - name: Build wheels
        run: uv run python scripts/build_wheels.py

      - name: Smoke install wheels
        run: uv run python scripts/smoke_install_wheels.py

      - name: Generate checksums
        run: sha256sum dist/*.whl > SHA256SUMS

      - name: Attest release asset provenance
        uses: actions/attest@281a49d4cbb0a72c9575a50d18f6deb515a11deb # v4
        with:
          subject-path: |
            dist/*.whl
            SHA256SUMS

      - name: Publish GitHub Release assets
        run: |
          gh release create "${TAG}" dist/*.whl SHA256SUMS \
            --title "${TAG}" \
            --notes "Hegemony step-handler SDK and plugin wheels for ${TAG}." \
            --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
