# A merge to main is a release. The shared workflow runs semantic-release,
# which reads the Conventional Commits since the last tag and decides whether
# there is anything to release; .releaserc.json in this repository holds the
# version bump, wheel build and asset list. There is no tag to push by hand.

name: Release

on:
  push:
    branches: [main]
  # Re-run without a push: after adding RELEASE_TOKEN, or when a run failed
  # after the merge. semantic-release decides from the commits whether there
  # is anything to release, so a dispatch on an already released tip is a
  # no-op rather than a duplicate.
  workflow_dispatch:

permissions: {}

jobs:
  release:
    name: Release
    # Belt and braces: GitHub already skips push runs whose head commit says
    # [skip ci], which the release commit semantic-release pushes does.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    # Pinned to a commit, never a branch: the called workflow receives
    # RELEASE_TOKEN and this job's write permission, so what runs must be the
    # reviewed code. The comment names the branch the pin was taken from; bump
    # the SHA in a pull request to pick up a change merged there (the
    # workflow's own release-tools lockfile moves with it).
    uses: hegemony-sh/hegemony-github-workflows/.github/workflows/plugin-release.yml@d20ba44f6b5bbcacf4cd35e0168a593e81e526a2 # main
    # The union of what the called workflow's jobs need; it narrows per job
    # (contents: write for the release; id-token, attestations and
    # artifact-metadata for the provenance attestation of public releases).
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    # Explicit mapping rather than `secrets: inherit`: the called workflow
    # needs exactly one secret, and naming it keeps every other secret this
    # repository holds, now or later, out of a workflow it does not own.
    # RELEASE_TOKEN is a repository or organization secret; the called
    # workflow fails fast with a clear message when it arrives empty.
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
