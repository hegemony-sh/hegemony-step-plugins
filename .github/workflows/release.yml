# A merge to main is a release. The shared workflow runs semantic-release,
# which reads the Conventional Commits since the last tag and decides whether
# there is anything to release; .releaserc.json in this repository holds the
# version bump, wheel build and asset list. There is no tag to push by hand.

name: Release

on:
  push:
    branches: [main]
  # Re-run without a push: after adding RELEASE_TOKEN, or when a run failed
  # after the merge. semantic-release decides from the commits whether there
  # is anything to release, so a dispatch on an already released tip is a
  # no-op rather than a duplicate.
  workflow_dispatch:

permissions: {}

jobs:
  release:
    name: Release
    # Belt and braces: GitHub already skips push runs whose head commit says
    # [skip ci], which the release commit semantic-release pushes does.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    # Pinned to a commit, never a branch: the called workflow receives
    # RELEASE_TOKEN and this job's write permission, so what runs must be the
    # reviewed code. The comment names the branch the pin was taken from; bump
    # the SHA in a pull request to pick up a change merged there (the
    # workflow's own release-tools lockfile moves with it).
    uses: hegemony-sh/hegemony-github-workflows/.github/workflows/plugin-release.yml@5a9633fe7a654e90a7384c960028705f1f51d524 # main
    # The union of what the called workflow's jobs need; it narrows per job
    # (contents: write for the release; id-token, attestations and
    # artifact-metadata for the provenance attestation of public releases).
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    # Explicit mapping rather than `secrets: inherit`: the called workflow
    # needs exactly one secret, and naming it keeps every other secret this
    # repository holds, now or later, out of a workflow it does not own.
    # RELEASE_TOKEN is a repository or organization secret; the called
    # workflow fails fast with a clear message when it arrives empty.
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  # The PyPI upload lives here, not in the shared workflow: PyPI's trusted
  # publishing does not work from inside a reusable workflow, so the publisher
  # each package has on PyPI names this file (release.yml) and the `pypi`
  # environment. It takes the files the release job built, checksummed and
  # attested (the release-assets artifact), rather than building again.
  pypi:
    name: Publish to PyPI
    needs: release
    # Only after the GitHub Release is published: an upload to PyPI cannot
    # be undone, only yanked.
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
    permissions:
      id-token: write # trusted publishing and the PyPI (PEP 740) attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      # Upload exactly the files the GitHub Release carries and the attest
      # job signed: every wheel and sdist must be in SHA256SUMS with a
      # matching hash and carry the released version. PyPI refuses
      # SHA256SUMS itself as an unknown file type, so it goes once checked.
      - name: Check the files against the release
        working-directory: dist
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          sha256sum --check --strict SHA256SUMS
          shopt -s nullglob
          for file in *.whl *.tar.gz; do
            grep -q "  ${file}\$" SHA256SUMS || { echo "::error::${file} is not in SHA256SUMS"; exit 1; }
            case "$file" in
              *-"${VERSION}"-py3-none-any.whl | *-"${VERSION}".tar.gz) ;;
              *) echo "::error::${file} is not a ${VERSION} file"; exit 1 ;;
            esac
          done
          rm SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          attestations: true # PEP 740 attestations, shown on PyPI
          print-hash: true
          skip-existing: true
