name: Release Wheels

on:
  push:
    tags:
      - "v*"
  # Cut a release without a terminal: dispatching on a branch creates the
  # given tag at that branch's head inside this same run, then releases it —
  # identical to pushing the tag by hand.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create at this branch's head (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  release:
    name: Build And Publish Wheel Assets
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the GitHub Release and upload assets
      id-token: write # to mint OIDC tokens for attestation signing
      attestations: write # to attach build provenance attestations
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Resolve release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          # Strict vX.Y.Z. The line-count test rejects a multi-line input
          # before the regex, because grep matches line by line — without it
          # an embedded newline would corrupt $GITHUB_OUTPUT.
          if [ "$(printf '%s' "$TAG" | wc -l)" -ne 0 ] \
            || ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::release tag must look like vX.Y.Z, got '$TAG'"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098 # v7
        with:
          version: "0.9.28"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --frozen --all-packages

      - name: Verify tag matches package versions
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: uv run python scripts/verify_release_version.py "${TAG}"

      - name: Verify release does not already exist
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::error::Release ${TAG} already exists; releases are immutable."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}

      - name: Run tests
        run: uv run pytest -v --tb=short

      - name: Build wheels
        run: uv run python scripts/build_wheels.py

      - name: Smoke install wheels
        run: uv run python scripts/smoke_install_wheels.py

      - name: Generate checksums
        run: sha256sum dist/*.whl > SHA256SUMS

      # Artifact attestations need a public repository (or an Enterprise
      # plan), so they are unavailable while the repos are private
      # pre-launch. Gating on visibility rather than deleting the step means
      # attestation resumes by itself the moment the repo goes public — there
      # is nothing to remember to revert.
      - name: Attest release asset provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@281a49d4cbb0a72c9575a50d18f6deb515a11deb # v4
        with:
          subject-path: |
            dist/*.whl
            SHA256SUMS

      # Created only once every guard above has passed and the wheels are
      # built, so a failed run never leaves a tag without a release. Re-runs
      # are safe: an existing tag is accepted when it already points at this
      # commit and rejected when it points anywhere else. A tag created with
      # the workflow's own token does not trigger a second run.
      - name: Create release tag (dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Detect an existing tag by the lookup's EXIT STATUS, not its output:
          # gh api prints the 404 body on stdout, so capturing stdout treats a
          # missing tag as an existing one.
          if ref_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" \
            --jq .object.type 2>/dev/null)"; then
            existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" \
              --jq .object.sha)"
            # An annotated ref points at the tag object, not the commit — peel it.
            if [ "$ref_type" = "tag" ]; then
              existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${existing}" \
                --jq .object.sha)"
            fi
            if [ "$existing" = "$GITHUB_SHA" ]; then
              echo "Tag ${TAG} already points at ${GITHUB_SHA}; reusing it."
              exit 0
            fi
            echo "::error::Tag ${TAG} already exists at ${existing}, not ${GITHUB_SHA}."
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" -f sha="${GITHUB_SHA}"

      - name: Publish GitHub Release assets
        run: |
          gh release create "${TAG}" dist/*.whl SHA256SUMS \
            --title "${TAG}" \
            --notes "Hegemony step-handler SDK and plugin wheels for ${TAG}." \
            --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
