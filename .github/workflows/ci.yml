name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

# Runner selection, as in the platform repository: the CI_RUNNER repository or
# organization variable names the runner label (e.g. `self-hosted`); unset,
# jobs fall back to GitHub-hosted ubuntu-latest, so one variable flips the
# workflow back if the self-hosted host is down. The release workflow is not
# included on purpose: it writes the release token into its workspace, which
# must not outlive the job on a non-ephemeral runner.
#
# Once this repository is public it takes pull requests from forks, and this
# workflow runs on pull_request, so a fork's pull request runs these jobs on
# whatever CI_RUNNER names. A self-hosted runner executes what the pull
# request's workflow asks of it on the organization's own host, where the
# runners share one Docker daemon. Keep CI_RUNNER unset for a public
# repository (GitHub-hosted runners are free for it); if it must name
# self-hosted runners, set "Require approval for all outside collaborators"
# under Settings > Actions > General > Fork pull request workflows.
jobs:
  commit-lint:
    name: Lint Commit Messages
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    if: github.event_name == 'pull_request'
    permissions:
      contents: read # to check out commit history for commitlint
      pull-requests: read # required by wagoid/commitlint-github-action to read PR commits
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6
        with:
          configFile: commitlint.config.mjs

  lint-test-build:
    name: Lint, Test, Build Wheels
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098 # v7
        with:
          version: "0.9.28"

      - name: Install dependencies
        run: uv sync --frozen --all-packages

      - name: Run linter
        run: uv run ruff check packages plugins probes transports tests scripts

      - name: Check formatting
        run: uv run ruff format --check packages plugins probes transports tests scripts

      - name: REUSE compliance
        run: uv run reuse lint

      - name: Type check
        run: uv run ty check

      - name: Run tests
        run: uv run pytest -v --tb=short

      - name: Check plugin docs contract
        run: uv run python scripts/check_docs.py

      - name: Build wheels
        run: uv run python scripts/build_wheels.py

      - name: Smoke install wheels
        run: uv run python scripts/smoke_install_wheels.py

  # The secret scan and the workflow policy scan used to run only as local
  # pre-commit hooks, which nothing enforces for a contributor who skips them
  # or for a pull request from a fork. Same checks and versions as the hooks in
  # .pre-commit-config.yaml; the platform repository's security-scans job does
  # the same.
  security-scans:
    name: Security Scans (gitleaks, zizmor)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # gitleaks reads the commits the pull request or push adds.
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098 # v7
        with:
          version: "0.9.28"

      # The same version as the pre-commit hook. A release binary checked
      # against the digest the gitleaks project publishes with it, not the
      # gitleaks-action, which needs a licence key for organization repositories.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

      # The commits this pull request (or push) adds, like the pre-commit hook
      # checks each commit's changes: a secret already in history is not this
      # change's to answer for. .gitleaks.toml allows the invented NetBox tokens
      # in the tests.
      - name: Scan the new commits for secrets (gitleaks)
        env:
          RANGE_START: ${{ github.event.pull_request.base.sha || github.event.before }}
          RANGE_END: ${{ github.event.pull_request.head.sha || github.sha }}
        # A push that creates the branch reports an all-zero `before`; with
        # nothing to diff against, the scan reads the pushed commit alone.
        run: |
          if [ -z "${RANGE_START//0/}" ]; then
            log_opts="-1 $RANGE_END"
          else
            log_opts="$RANGE_START..$RANGE_END"
          fi
          "$RUNNER_TEMP/gitleaks" git --log-opts="$log_opts" --redact --no-banner .

      # Offline, as the pre-commit hook runs without a GitHub token; the online
      # audits would also need one here.
      - name: GitHub Actions policy scan (zizmor)
        run: uvx zizmor@1.22.0 --offline --config .github/zizmor.yml .github/workflows
