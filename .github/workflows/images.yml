# Publishes the steps' default execution images, ghcr.io/<owner>/<name>, from
# images/<name>: ansible-runner (ansible.playbook), opentofu-runner (tf.plan
# and tf.apply with OpenTofu) and git-runner (git.commit). scripts/package_paths.py lists the same images.
#
# ansible-runner and opentofu-runner are built once per tool series in
# images/<name>/variants.json, each with that entry's build arguments. The
# default series gets the tags described below; every series, the default
# too, also gets X.Y.Z-<tag><series> and X.Y-<tag><series> (0.51-tofu1.13),
# which the steps' version settings name.
#
# Publishing the GitHub Release vX.Y.Z (the Release workflow does, with
# RELEASE_TOKEN) publishes X.Y.Z and X.Y from its tag. Not the tag push: the
# tagged release commit says [skip ci], which stops every push-triggered run,
# tag pushes included. The steps' defaults name X.Y, which
# scripts/set_version.py moves with every release and the release commit
# carries, so the wheels of a release pull the images built from the same
# tag. A pull request that changes an image builds, smoke-tests and scans
# both the same way, without pushing. Each image's smoke-test.sh runs inside
# it. workflow_dispatch, started at the tag itself (gh workflow run
# images.yml --ref vX.Y.Z -f tag=vX.Y.Z), publishes that release again, after a
# failed run or to pick up OS package fixes under the same tags (X.Y only
# while that tag is the newest X.Y release): the base images are pinned by
# digest, and the Dockerfiles upgrade their packages at build time. A newer
# base image itself arrives through a Renovate digest pull request and the
# next release.
#
# The image is built once and pushed by digest only; Trivy scans that digest
# and the smoke test runs it before any tag points at it, so what the tags
# name is what was checked (the platform repository's docker-publish does the
# same).

name: Images

on:
  release:
    types: [published]
  pull_request:
    branches: [main, develop]
    paths:
      - "images/ansible-runner/**"
      - "images/opentofu-runner/**"
      - "images/git-runner/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.6.0"
        required: true
        type: string

permissions: {}

# One run per release tag at a time, whether its Release or a re-publish of it.
concurrency:
  group: images-${{ github.event.pull_request.number || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  image:
    name: ${{ matrix.name || matrix.image }}
    # Runner selection as in ci.yml (CI_RUNNER, else GitHub-hosted); read the
    # note there before the repository takes pull requests from forks: a pull
    # request that changes an image builds and runs that image on this runner.
    # The self-hosted runners share one Docker daemon, so a pull request's
    # image carries the run in its tag and is removed at the end of the job.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      # For the signing steps, which run only when a release publishes:
      # `id-token` gets them a short-lived Sigstore certificate, and
      # `attestations` stores the provenance with the repository. A job's
      # permissions cannot depend on the event, so a pull request's run holds
      # them too; none of its steps uses them.
      id-token: write
      attestations: write
    strategy:
      # A release publishes each image on its own: one image's failure must
      # not cancel the other's promotion half-way.
      fail-fast: false
      matrix:
        include:
          - image: ansible-runner
            description: Default execution image of the Hegemony ansible.playbook step
            # What the image contains (no Hegemony code); its notices list each component.
            licenses: GPL-3.0-or-later AND GPL-2.0-only AND GPL-2.0-or-later AND LGPL-2.1-or-later AND Python-2.0 AND Apache-2.0 AND MIT AND BSD-3-Clause AND MPL-2.0 AND SSH-OpenSSH
            # The line that makes it the step's default, {image} standing for
            # IMAGE:X.Y.
            default_file: plugins/steps_ansible/src/hegemony_steps_ansible/playbook.py
            default_line: 'DEFAULT_IMAGE = "{image}"'
            # The tool series this entry builds, from images/<name>/variants.json.
            # The default series is the image the plain tags name; every
            # series, the default too, is also tagged X.Y.Z-<tag><series> and
            # X.Y-<tag><series> (0.51-core2.19), which a step's version
            # setting names. tests/test_release_versions.py checks these
            # entries against variants.json.
            variant: "2.19"
          - image: ansible-runner
            name: ansible-runner (ansible-core 2.21)
            description: Execution image of the Hegemony ansible.playbook step with ansible-core 2.21
            licenses: GPL-3.0-or-later AND GPL-2.0-only AND GPL-2.0-or-later AND LGPL-2.1-or-later AND Python-2.0 AND Apache-2.0 AND MIT AND BSD-3-Clause AND MPL-2.0 AND SSH-OpenSSH
            variant: "2.21"
          - image: opentofu-runner
            description: Default OpenTofu image of the Hegemony tf.plan and tf.apply steps
            licenses: MPL-2.0 AND BSD-3-Clause AND Apache-2.0 AND MIT AND GPL-2.0-only AND GPL-2.0-or-later AND SSH-OpenSSH
            default_file: plugins/steps_tf/src/hegemony_steps_tf/common.py
            default_line: '    "opentofu": "{image}",'
            variant: "1.12"
          - image: opentofu-runner
            name: opentofu-runner (OpenTofu 1.13)
            description: OpenTofu 1.13 image of the Hegemony tf.plan and tf.apply steps
            licenses: MPL-2.0 AND BSD-3-Clause AND Apache-2.0 AND MIT AND GPL-2.0-only AND GPL-2.0-or-later AND SSH-OpenSSH
            variant: "1.13"
          - image: git-runner
            description: Default execution image of the Hegemony git.commit step
            licenses: GPL-2.0-only AND GPL-2.0-or-later AND MIT AND MPL-2.0 AND Apache-2.0
            default_file: plugins/steps_git/src/hegemony_steps_git/commit.py
            default_line: 'DEFAULT_IMAGE = "{image}"'
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
      # A pull request's image in the runner's daemon. The self-hosted runners
      # share one daemon and the variants of an image build side by side, so
      # the tag carries the run and the variant.
      PR_IMAGE: ${{ matrix.image }}:pr-${{ github.run_id }}-${{ github.run_attempt }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}
    steps:
      - name: Resolve the release
        id: release
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            # A published image is always built by the tag's own workflow,
            # so its signature and provenance name refs/tags/<tag> and the
            # tag's commit, and verification can require exactly that.
            if [ "$REF" != "refs/tags/${tag}" ]; then
              echo "::error::start the run at the tag: gh workflow run images.yml --ref ${tag} -f tag=${tag}"
              exit 1
            fi
          else
            tag="$REF_NAME"
          fi
          if ! printf '%s\n' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::not a release tag: ${tag}"
            exit 1
          fi
          version="${tag#v}"
          {
            echo "publish=true"
            echo "ref=refs/tags/${tag}"
            echo "version=${version}"
            echo "minor=${version%.*}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ steps.release.outputs.ref }}
          persist-credentials: false

      # The tag's own step must name this minor version, or the release would
      # publish an image its wheels never pull.
      - name: Check the step names this release's image
        if: steps.release.outputs.publish == 'true' && matrix.default_file
        env:
          EXPECTED: ${{ env.IMAGE }}:${{ steps.release.outputs.minor }}
          DEFAULT_FILE: ${{ matrix.default_file }}
          DEFAULT_LINE: ${{ matrix.default_line }}
        run: |
          set -euo pipefail
          line="${DEFAULT_LINE//\{image\}/$EXPECTED}"
          if ! grep -Fqx -- "$line" "$DEFAULT_FILE"; then
            echo "::error::${DEFAULT_FILE} has no line: ${line}"
            exit 1
          fi

      # The variant's build arguments and tag suffix, from variants.json. An
      # image without variants (no matrix.variant) builds with its Dockerfile's
      # defaults and gets the plain tags only.
      - name: Variant
        id: variant
        env:
          NAME: ${{ matrix.image }}
          VARIANT: ${{ matrix.variant }}
          DEFAULT_FILE: ${{ matrix.default_file }}
        run: |
          set -euo pipefail
          if [ -z "$VARIANT" ]; then
            echo "plain=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - "images/${NAME}/variants.json" "$VARIANT" "$DEFAULT_FILE" >> "$GITHUB_OUTPUT" <<'PY'
          import json, re, sys

          path, variant, default_file = sys.argv[1:4]
          data = json.load(open(path, encoding="utf-8"))
          args = data["variants"].get(variant)
          if args is None:
              sys.exit(f"::error::{path} has no variant {variant}")
          is_default = variant == data["default"]
          # The entry that carries the step's default line is the default series.
          if is_default != bool(default_file):
              sys.exit(f"::error::{path} names {data['default']} as the default series")
          for key, value in args.items():
              if not re.fullmatch(r"[A-Z][A-Z0-9_]*", key) or "\n" in value:
                  sys.exit(f"::error::{path}: bad build argument {key}")
          suffix = f"{data['tag']}{variant}"
          if not re.fullmatch(r"[a-z]+[0-9]+\.[0-9]+", suffix):
              sys.exit(f"::error::{path}: bad tag suffix {suffix}")
          print(f"plain={'true' if is_default else 'false'}")
          print(f"suffix={suffix}")
          print(f"version={args[data['version_arg']]}")
          print("build_args<<EOF")
          for key, value in args.items():
              print(f"{key}={value}")
          print("EOF")
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3

      - name: Image labels
        id: labels
        env:
          VERSION: ${{ steps.release.outputs.version }}
          REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
          TITLE: ${{ matrix.image }}
          DESCRIPTION: ${{ matrix.description }}
          LICENSES: ${{ matrix.licenses }}
        run: |
          set -euo pipefail
          {
            echo "labels<<EOF"
            echo "org.opencontainers.image.title=${TITLE}"
            echo "org.opencontainers.image.description=${DESCRIPTION}"
            echo "org.opencontainers.image.source=${REPOSITORY}"
            echo "org.opencontainers.image.revision=$(git rev-parse HEAD)"
            echo "org.opencontainers.image.version=${VERSION:-dev}"
            echo "org.opencontainers.image.licenses=${LICENSES}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Pull requests: build into the runner's daemon and stop there.
      - name: Build
        if: steps.release.outputs.publish != 'true'
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6
        with:
          context: images/${{ matrix.image }}
          build-args: ${{ steps.variant.outputs.build_args }}
          labels: ${{ steps.labels.outputs.labels }}
          tags: ${{ env.PR_IMAGE }}
          load: true
          push: false

      - name: Log in to GHCR
        if: steps.release.outputs.publish == 'true'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reachable only as IMAGE@sha256:... until the promote step below.
      - name: Build and push by digest
        id: build
        if: steps.release.outputs.publish == 'true'
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6
        with:
          context: images/${{ matrix.image }}
          build-args: ${{ steps.variant.outputs.build_args }}
          labels: ${{ steps.labels.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Explicit, so the pushed digest is always an index that the
          # promote step tags as it is, whatever the runner's defaults.
          provenance: mode=min

      - name: Image reference
        id: ref
        env:
          PUBLISH: ${{ steps.release.outputs.publish }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            echo "image=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
          else
            echo "image=${PR_IMAGE}" >> "$GITHUB_OUTPUT"
          fi

      # What the steps rely on, checked inside the image before any tag names
      # it: images/<name>/smoke-test.sh, run by the image's /bin/sh. For a
      # variant it also checks the tool has the version variants.json names,
      # so a build that ignored its build arguments never gets a variant's tag.
      - name: Smoke test
        env:
          IMAGE_REF: ${{ steps.ref.outputs.image }}
          NAME: ${{ matrix.image }}
          EXPECT_VERSION: ${{ steps.variant.outputs.version }}
        run: docker run --rm -i -e EXPECT_VERSION "$IMAGE_REF" -s < "images/${NAME}/smoke-test.sh"

      # Gates the promotion: a CRITICAL/HIGH finding with a fixed version
      # upstream fails the job before any tag names the image. It fails a pull
      # request the same way, so an image the release would refuse is caught
      # before it merges. Findings with no fix are reported by the next step.
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ steps.ref.outputs.image }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Report unfixable findings (non-blocking)
        if: ${{ !cancelled() && steps.ref.outputs.image != '' }}
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ steps.ref.outputs.image }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
          ignore-unfixed: false

      # Signed provenance and a keyless signature for the scanned digest,
      # before the promote step: a failure here fails the job before any tag
      # exists, so no release tag ever names an unsigned image. Both are
      # recorded in the public Rekor log under this repository's identity.
      # Every publishing run starts at its release tag (checked above), so
      # the README's verify commands accept only images.yml@refs/tags/vX.Y.Z.
      - name: Install cosign
        if: steps.release.outputs.publish == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # SLSA build provenance (no predicate given), kept with the repository's
      # attestations and pushed to the registry beside the image. It names
      # the run's commit, which is the tag's commit built here.
      - name: Attest build provenance
        if: steps.release.outputs.publish == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Sign the scanned digest
        if: steps.release.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # X.Y names the newest X.Y.Z release: re-publishing an older one (a
      # workflow_dispatch of v0.6.0 after v0.6.1) updates only its own X.Y.Z.
      # Checked just before writing the tags. A newer release's tag exists
      # before its own run starts, and that run needs minutes to get here, so
      # an older run that passed this check has written its tags long before.
      - name: Promote the scanned digest to the release tags
        if: steps.release.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.release.outputs.version }}
          MINOR: ${{ steps.release.outputs.minor }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          # The plain tags (X.Y.Z, X.Y) name the default series only; every
          # variant also gets its own (X.Y.Z-<suffix>, X.Y-<suffix>).
          PLAIN: ${{ steps.variant.outputs.plain }}
          SUFFIX: ${{ steps.variant.outputs.suffix }}
        run: |
          set -euo pipefail
          latest="$(
            gh api --paginate "repos/${REPOSITORY}/git/matching-refs/tags/v${MINOR}." --jq '.[].ref' \
              | python3 -c '
          import re, sys
          minor = sys.argv[1]
          release = re.compile(r"refs/tags/v" + re.escape(minor) + r"\.(\d+)$")
          patches = [int(m.group(1)) for line in sys.stdin if (m := release.match(line.strip()))]
          print(f"{minor}.{max(patches)}" if patches else "")
          ' "$MINOR"
          )"
          names=()
          if [ "$PLAIN" = "true" ]; then names+=(""); fi
          if [ -n "$SUFFIX" ]; then names+=("-${SUFFIX}"); fi
          if [ "${#names[@]}" -eq 0 ]; then
            echo "::error::no tag to give the image"
            exit 1
          fi
          if [ -z "$latest" ]; then
            echo "::error::found no release tag v${MINOR}.N"
            exit 1
          fi
          tags=()
          for name in "${names[@]}"; do
            tags+=("${IMAGE}:${VERSION}${name}")
            if [ "$latest" = "$VERSION" ]; then
              tags+=("${IMAGE}:${MINOR}${name}")
            else
              echo "::notice::${VERSION} is not the newest ${MINOR} release (${latest}): ${IMAGE}:${MINOR}${name} stays"
            fi
          done
          args=()
          for tag in "${tags[@]}"; do args+=(--tag "$tag"); done
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"
          for tag in "${tags[@]}"; do
            resolved="$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')"
            if [ "$resolved" != "$DIGEST" ]; then
              echo "::error::${tag} resolves to ${resolved}, expected ${DIGEST}"
              exit 1
            fi
            echo "ok: ${tag} -> ${resolved}"
          done

      # A pull request's image was loaded into the runner's Docker daemon,
      # which outlives the job on a self-hosted runner.
      - name: Remove the pull request image
        if: ${{ always() && steps.release.outputs.publish != 'true' }}
        run: docker image rm "$PR_IMAGE" >/dev/null 2>&1 || true
