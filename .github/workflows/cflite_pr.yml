# Fuzzes every pull request with ClusterFuzzLite: .clusterfuzzlite/ builds the
# fuzz/*_fuzzer.py targets with Atheris, and each runs for a few minutes
# against the pull request's code. A crash fails the check and is kept as the
# run's artifact, with the input that caused it.

name: ClusterFuzzLite

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: cflite-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address

      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: code-change
          sanitizer: address
