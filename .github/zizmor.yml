# Zizmor configuration for GitHub Actions security scanning.
# Exceptions intentionally removed: workflows should be policy-compliant by default.
rules:
  unpinned-uses:
    config:
      # Everything is pinned to a commit SHA, the organization's own
      # hegemony-github-workflows release workflow included: it receives the release
      # token, so a bump to it is a reviewed pull request, not a branch move.
      policies:
        "*": hash-pin
