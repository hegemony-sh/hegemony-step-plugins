version = 1
SPDX-PackageName = "hegemony-step-plugins"
SPDX-PackageSupplier = "Rexonix s.r.o."
SPDX-PackageDownloadLocation = "https://github.com/hegemony-sh/hegemony-step-plugins"

[[annotations]]
path = "uv.lock"
precedence = "aggregate"
SPDX-FileCopyrightText = "2025-2026 Rexonix s.r.o."
SPDX-License-Identifier = "AGPL-3.0-or-later"

# JSON config files (no comment syntax) and the changelog semantic-release
# rewrites on every release: a header at its top would be pushed below the
# newest entry.
[[annotations]]
path = [
    ".releaserc.json",
    ".github/renovate.json",
    "CHANGELOG.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025-2026 Rexonix s.r.o."
SPDX-License-Identifier = "AGPL-3.0-or-later"
