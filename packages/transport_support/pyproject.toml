[project]
name = "hegemony-transport-support"
version = "0.54.1"
description = "Internal code shared by Hegemony's built-in device transports (no stability promise)"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE-*.txt"]
requires-python = ">=3.11"
# No SSH library: callers pass their library module or objects in, like the
# SDK policy it applies.
dependencies = ["hegemony-step-sdk==0.54.1"]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hegemony_transport_support"
module-root = "src"
