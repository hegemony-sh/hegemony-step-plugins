[project]
name = "hegemony-transport-napalm"
version = "0.59.0"
description = "NAPALM device transport for Hegemony: network CLI plus NAPALM driver sessions"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE-*.txt"]
requires-python = ">=3.11"
dependencies = [
    "hegemony-step-sdk==1.2.0",
    # Built on the netmiko transport's hardened SSH login (host-key trust,
    # jump host, algorithm policy, cancellation): NAPALM's SSH drivers run on
    # a netmiko connection, and this wheel hands them that one.
    "hegemony-transport-netmiko==0.59.0",
    "napalm>=5.0,<6",
]

[project.entry-points."hegemony.device_transports"]
"napalm" = "hegemony_transport_napalm:register"

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hegemony_transport_napalm"
module-root = "src"
