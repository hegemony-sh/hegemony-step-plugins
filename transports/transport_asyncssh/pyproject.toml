[project]
name = "hegemony-transport-asyncssh"
version = "0.56.0"
description = "AsyncSSH exec-channel device transport for Hegemony"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE-*.txt"]
requires-python = ">=3.11"
dependencies = [
    "hegemony-step-sdk==1.0.0",
    "hegemony-transport-support==0.56.0",
    "asyncssh>=2.24.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://hegemony.sh"
Documentation = "https://hegemony.sh"
Source = "https://github.com/hegemony-sh/hegemony-step-plugins"
Issues = "https://github.com/hegemony-sh/hegemony-step-plugins/issues"
Changelog = "https://github.com/hegemony-sh/hegemony-step-plugins/blob/main/CHANGELOG.md"

[project.entry-points."hegemony.device_transports"]
"asyncssh" = "hegemony_transport_asyncssh:register"

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hegemony_transport_asyncssh"
module-root = "src"
