[project]
name = "hegemony-transport-scrapli"
version = "0.59.0"
description = "Scrapli network-CLI device transport for Hegemony"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE-*.txt"]
requires-python = ">=3.11"
dependencies = [
    "hegemony-step-sdk==1.1.1",
    "hegemony-transport-support==0.59.0",
    # asyncssh extra: already the platform's SSH library. The default "system"
    # transport shells out to a local ssh binary (not in worker images), and the
    # paramiko extra caps paramiko <4 for the whole install.
    # <2026.10: scrapli 2026.10.3 is the first scrapli 2 release, a rewrite on
    # a native library. It has no AsyncScrapli, no asyncssh transport and no
    # asyncssh extra; 2026.2.20 is the last release with the API used here.
    "scrapli[asyncssh]>=2024.7.30,<2026.10",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://hegemony.sh"
Documentation = "https://hegemony.sh"
Source = "https://github.com/hegemony-sh/hegemony-step-plugins"
Issues = "https://github.com/hegemony-sh/hegemony-step-plugins/issues"
Changelog = "https://github.com/hegemony-sh/hegemony-step-plugins/blob/main/CHANGELOG.md"

[project.entry-points."hegemony.device_transports"]
"scrapli" = "hegemony_transport_scrapli:register"

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hegemony_transport_scrapli"
module-root = "src"
